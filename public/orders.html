<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.order-item{background:#fff;margin:12px;border-radius:12px;padding:16px}
.order-no{font-size:13px;color:#999;margin-bottom:6px}
.order-name{font-size:16px;font-weight:600;margin-bottom:6px}
.order-row{display:flex;justify-content:space-between;align-items:center}
.status{padding:3px 10px;border-radius:20px;font-size:12px}
.paid{background:#e8f5e9;color:#4caf50}
.unpaid{background:#ffebee;color:#f44336}
.price{color:#ff5252;font-weight:700}
</style>
</head>
<body>
<div class="header">
  <a href="dashboard.html">‹</a>
  <h2>订单管理</h2>
</div>
<div id="list"></div>
<script>
const uid=localStorage.getItem('uid');
async function load(){
  const res=await fetch('/api/orders?mid='+uid);
  const data=await res.json();
  const el=document.getElementById('list');
  if(data.length===0){el.innerHTML='<div style="text-align:center;padding:80px;color:#999">暂无订单</div>';return}
  el.innerHTML=data.map(o=>`
    <div class="order-item">
      <div class="order-no">订单号：${o.order_no}</div>
      <div class="order-name">${o.name||'商品'}</div>
      <div class="order-row">
        <div class="price">￥${o.amount}</div>
        <span class="status ${o.status==1?'paid':'unpaid'}">${o.status==1?'已付款':'未付款'}</span>
      </div>
    </div>
  `).join('');
}
load();
</script>
</body>
</html>
