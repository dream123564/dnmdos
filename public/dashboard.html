<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家中心 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333;padding-bottom:70px}
.top-user{background:#f5f5f7;padding:20px;display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;background:linear-gradient(135deg,#1677FF,#2196F3);border-radius:14px;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;font-weight:bold}
.stats-bar{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;display:flex}
.stat{flex:1;text-align:center;padding:24px 8px}
.stat-num{font-size:28px;font-weight:700}
.stat-label{font-size:13px;opacity:.9;margin-top:4px}
.data-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 12px}
.data-card{background:#fff;border-radius:12px;padding:16px}
.data-label{font-size:13px;color:#999}
.data-val{font-size:24px;font-weight:700;margin-top:4px}
.data-sub{font-size:12px;color:#ccc;margin-top:2px}
.notice{background:#fff;margin:12px;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px;font-size:14px}
.notice-tag{background:#e3f2fd;color:#1677FF;padding:4px 10px;border-radius:6px;font-size:12px;white-space:nowrap}
.section-title{font-size:16px;font-weight:600;padding:16px 16px 8px}
.feat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#fff;margin:0 12px 12px;border-radius:12px;padding:20px 0}
.feat{text-align:center;text-decoration:none;color:#333}
.feat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:22px}
.feat-label{font-size:13px;color:#666}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.bottom-nav a{text-decoration:none;color:#999;font-size:12px;text-align:center}
.bottom-nav a.active{color:#2196F3}
.bottom-nav .icon{font-size:22px;line-height:1.2}
</style>
</head>
<body>

<div class="top-user">
  <div class="avatar">龙</div>
  <div>
    <div style="font-size:16px;font-weight:600" id="email"></div>
    <div style="font-size:13px;color:#999">商家ID：<span id="uid"></span></div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">待付款</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">待发货</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">售后中</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">库存预警</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">违规</div></div>
</div>

<div class="data-row">
  <div class="data-card">
    <div class="data-label">支付金额</div>
    <div class="data-val">￥0.00</div>
    <div class="data-sub">昨日</div>
  </div>
  <div class="data-card">
    <div class="data-label">访客数</div>
    <div class="data-val">0</div>
    <div class="data-sub">昨日</div>
  </div>
  <div class="data-card">
    <div class="data-label">订单数</div>
    <div class="data-val">0</div>
    <div class="data-sub">昨日</div>
  </div>
</div>

<div class="notice">
  <span class="notice-tag">平台公告</span>
  <span>欢迎使用龙黑发卡，自动发货24小时营业</span>
</div>

<div class="section-title">商品管理</div>
<div class="feat-row">
  <a href="goods.html" class="feat">
    <div class="feat-icon" style="background:#e3f2fd">📦</div>
    <div class="feat-label">自营商品</div>
  </a>
  <a href="goods_edit.html" class="feat">
    <div class="feat-icon" style="background:#fff3e0">➕</div>
    <div class="feat-label">添加商品</div>
  </a>
  <a href="categories.html" class="feat">
    <div class="feat-icon" style="background:#e8f5e9">🔲</div>
    <div class="feat-label">商品分类</div>
  </a>
</div>

<div class="section-title">订单管理</div>
<div class="feat-row">
  <a href="orders.html" class="feat">
    <div class="feat-icon" style="background:#e3f2fd">📋</div>
    <div class="feat-label">订单管理</div>
  </a>
  <a href="orders.html?status=0" class="feat">
    <div class="feat-icon" style="background:#fff3e0">⏰</div>
    <div class="feat-label">待发货订单</div>
  </a>
  <a href="cards.html" class="feat">
    <div class="feat-icon" style="background:#f3e5f5">💳</div>
    <div class="feat-label">卡密管理</div>
  </a>
</div>

<div class="section-title">运营策略</div>
<div class="feat-row">
  <a href="coupons.html" class="feat">
    <div class="feat-icon" style="background:#fff3e0">🎫</div>
    <div class="feat-label">优惠券</div>
  </a>
  <a href="plugins.html" class="feat">
    <div class="feat-icon" style="background:#e8f5e9">🔌</div>
    <div class="feat-label">插件中心</div>
  </a>
  <a href="stats.html" class="feat">
    <div class="feat-icon" style="background:#ffebee">📍</div>
    <div class="feat-label">购买分布</div>
  </a>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="active"><div class="icon">🏠</div><div>首页</div></a>
  <a href="shop_settings.html"><div class="icon">🏪</div><div>店铺</div></a>
  <a href="wallet.html"><div class="icon">👛</div><div>钱包</div></a>
</div>

<script>
const uid=localStorage.getItem('uid');
const email=localStorage.getItem('email');
if(!uid)location.href='login.html';
document.getElementById('email').textContent=email;
document.getElementById('uid').textContent=uid;
</script>
</body>
</html>
