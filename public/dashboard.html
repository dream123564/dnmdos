<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家中心 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333;padding-bottom:70px}
.user-bar{background:#f5f5f7;padding:20px;display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;background:linear-gradient(135deg,#1677FF,#2196F3);border-radius:14px;display:flex;align-items:center;justify-content:center}
.avatar svg{width:30px;height:30px;fill:white}
.stats{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;display:flex;margin:12px;border-radius:12px;overflow:hidden}
.stat{flex:1;text-align:center;padding:20px 10px}
.stat-num{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;opacity:.9}
.data-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:12px}
.data-card{background:#fff;border-radius:12px;padding:16px}
.data-label{font-size:13px;color:#999;margin-bottom:8px}
.data-val{font-size:24px;font-weight:700}
.section-title{font-size:16px;font-weight:600;margin:20px 16px 12px}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 16px}
.feat{text-align:center;text-decoration:none;color:#333;display:block}
.feat-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.feat-icon svg{width:28px;height:28px}
.feat-label{font-size:13px;color:#666}
.notice-bar{background:#e3f2fd;color:#1677FF;padding:12px 16px;margin:12px;border-radius:10px;font-size:14px;display:flex;align-items:center;gap:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.bottom-nav a{text-decoration:none;color:#999;font-size:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottom-nav a.active{color:#2196F3}
.bottom-nav svg{width:22px;height:22px}
</style>
</head>
<body>

<div class="user-bar">
  <div class="avatar">
    <svg viewBox="0 0 24 24"><path d="M12 3L2 9v12h20V9L12 3zm0 2.5L19.5 10v9h-15v9L12 5.5z"/></svg>
  </div>
  <div>
    <div style="font-size:18px;font-weight:600" id="email"></div>
    <div style="font-size:13px;color:#999" id="uid"></div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">待付款</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">待发货</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">售后中</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">库存预警</div></div>
  <div class="stat"><div class="stat-num">0</div><div class="stat-label">违规</div></div>
</div>

<div class="data-row">
  <div class="data-card"><div class="data-label">支付金额</div><div class="data-val">￥0.00</div></div>
  <div class="data-card"><div class="data-label">访客数</div><div class="data-val">0</div></div>
  <div class="data-card"><div class="data-label">订单数</div><div class="data-val">0</div></div>
</div>

<div class="notice-bar">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="#1677FF"><path d="M18 11v2h-7v7H9v-7H2v-2h7V4h2v7h7z"/></svg>
  平台公告：欢迎使用龙黑发卡，自动发货24小时营业
</div>

<div class="section-title">商品管理</div>
<div class="feat-grid">
  <a href="goods.html" class="feat">
    <div class="feat-icon" style="background:#e3f2fd">
      <svg viewBox="0 0 24 24" fill="#2196F3"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6 0h-4V4h4v2z"/></svg>
    </div>
    <div class="feat-label">自营商品</div>
  </a>
  <a href="goods_edit.html" class="feat">
    <div class="feat-icon" style="background:#fff3e0">
      <svg viewBox="0 0 24 24" fill="#ff9800"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>
    <div class="feat-label">添加商品</div>
  </a>
  <a href="categories.html" class="feat">
    <div class="feat-icon" style="background:#e8f5e9">
      <svg viewBox="0 0 24 24" fill="#4caf50"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 6h4v-4h-4v4zm6-14v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    </div>
    <div class="feat-label">商品分类</div>
  </a>
</div>

<div class="section-title">订单管理</div>
<div class="feat-grid">
  <a href="orders.html" class="feat">
    <div class="feat-icon" style="background:#e3f2fd">
      <svg viewBox="0 0 24 24" fill="#2196F3"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm0-4H7v-2h7v2zm0-4H7V7h7v2z"/></svg>
    </div>
    <div class="feat-label">订单管理</div>
  </a>
  <a href="orders.html?status=0" class="feat">
    <div class="feat-icon" style="background:#fff3e0">
      <svg viewBox="0 0 24 24" fill="#ff9800"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/></svg>
    </div>
    <div class="feat-label">待发货订单</div>
  </a>
  <a href="cards.html" class="feat">
    <div class="feat-icon" style="background:#f3e5f5">
      <svg viewBox="0 0 24 24" fill="#9c27b0"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
    </div>
    <div class="feat-label">卡密管理</div>
  </a>
</div>

<div class="section-title">运营策略</div>
<div class="feat-grid">
  <a href="coupons.html" class="feat">
    <div class="feat-icon" style="background:#fff3e0">
      <svg viewBox="0 0 24 24" fill="#ff9800"><path d="M20 12c0-1.1-.9-2-2-2V6c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v4c-1.1 0-2 .9-2 2s.9 2 2 2v4c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-4c1.1 0 2-.9 2-2zm-7 6h-2v-2h2v2zm0-4h-2v-2h2v2zm4 4h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
    </div>
    <div class="feat-label">优惠券</div>
  </a>
  <a href="plugins.html" class="feat">
    <div class="feat-icon" style="background:#e8f5e9">
      <svg viewBox="0 0 24 24" fill="#4caf50"><path d="M14 9V5h-4v4H7v4H3v6h18v-6h-4V9h-3zm-2 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </div>
    <div class="feat-label">插件中心</div>
  </a>
  <a href="stats.html" class="feat">
    <div class="feat-icon" style="background:#ffebee">
      <svg viewBox="0 0 24 24" fill="#f44336"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="feat-label">购买分布</div>
  </a>
</div>

<div class="bottom-nav">
  <a href="dashboard.html" class="active">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <div>首页</div>
  </a>
  <a href="shop_settings.html">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 9v12h20V9L12 3z"/></svg>
    <div>店铺</div>
  </a>
  <a href="wallet.html">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14v2H5v11h16v-3h-9v-4h9V6c1.1 0 2 .9 2 2v10z"/></svg>
    <div>钱包</div>
  </a>
</div>

<script>
const uid=localStorage.getItem('uid');
const email=localStorage.getItem('email');
if(!uid)location.href='login.html';
document.getElementById('email').textContent=email;
document.getElementById('uid').textContent='商家ID：'+uid;
</script>
</body>
</html>
