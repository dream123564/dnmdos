<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.top-bar{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;text-align:center;padding:16px 20px}
.shop-header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:20px;display:flex;align-items:center;gap:14px}
.shop-avatar{width:56px;height:56px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center}
.shop-avatar svg{width:30px;height:30px;fill:white}
.shop-name{font-size:18px;font-weight:600}
.shop-id{font-size:13px;opacity:.85;margin-top:4px}
.notice{background:#fff3e0;color:#e65100;padding:12px 16px;margin:12px;border-radius:10px;font-size:14px}
.goods-card{background:#fff;border-radius:12px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.goods-name{font-size:16px;font-weight:600;margin-bottom:8px}
.goods-meta{font-size:13px;color:#999;margin-bottom:12px}
.goods-price{font-size:20px;color:#ff5252;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px}
.badge-green{background:#e8f5e9;color:#4caf50}
.btn-buy{background:#2196F3;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div class="top-bar">
  <h1>店铺首页</h1>
</div>

<div class="shop-header">
  <div class="shop-avatar">
    <svg viewBox="0 0 24 24"><path d="M12 3L2 9v12h20V9L12 3z"/></svg>
  </div>
  <div>
    <div class="shop-name" id="shopName">加载中...</div>
    <div class="shop-id" id="shopId"></div>
  </div>
</div>

<div class="notice">
  📢 欢迎来到龙黑发卡，24小时自动发货，即买即得！
</div>

<div id="goodsList"></div>

<div style="text-align:center;padding:40px 0;color:#ccc;font-size:13px">Copyright © 2026 龙黑发卡</div>

<script>
const params=new URLSearchParams(location.search);
const uid=params.get('uid');
let goodsList=[];

async function loadGoods(){
  const res=await fetch('/api/goods?mid='+uid);
  const goods=await res.json();
  goodsList=goods;
  const list=document.getElementById('goodsList');
  if(goods.length===0){
    list.innerHTML='<div style="text-align:center;padding:60px;color:#999">暂无商品</div>';
    return;
  }
  list.innerHTML=goods.map(g=>`
    <div class="goods-card">
      <div class="goods-name">${g.name}</div>
      <div class="goods-meta">${g.short_desc||''}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="goods-price">￥${g.price.toFixed(2)}</div>
        <button class="btn-buy" onclick="buy(${g.id})">立即购买</button>
      </div>
      <div style="font-size:13px;color:#999;margin-top:8px">
        库存 ${g.stock} 件 <span class="badge badge-green" style="margin-left:8px">现货充足</span>
      </div>
    </div>
  `).join('');
}

async function buy(id){
  const goods=goodsList.find(g=>g.id===id);
  if(!goods)return;
  const email=prompt('请输入你的邮箱（用于接收卡密）：');
  if(!email)return;
  const res=await fetch('/api/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goods_id:id,name:goods.name,money:goods.price.toFixed(2),return_url:location.href})});
  const data=await res.json();
  if(data.pay_url)location.href=data.pay_url;
}

loadGoods();
document.getElementById('shopName').textContent='商家'+uid;
document.getElementById('shopId').textContent='店铺ID：'+uid;
</script>
</body>
</html>
