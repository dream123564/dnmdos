<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>插件中心 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.plugin{background:#fff;margin:12px;border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.plugin-name{font-size:16px;font-weight:600}
.plugin-desc{font-size:13px;color:#999;margin-top:4px}
.switch{width:48px;height:28px;border-radius:14px;background:#ccc;position:relative;cursor:pointer;transition:.3s}
.switch.on{background:#4caf50}
.switch::after{content:'';width:24px;height:24px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;transition:.3s}
.switch.on::after{left:22px}
</style>
</head>
<body>
<div class="header">
  <a href="dashboard.html">‹</a>
  <h2>插件中心</h2>
</div>
<div id="list"></div>
<script>
const plugins=[
  {id:'email',name:'邮件通知',desc:'支付成功后自动发邮件给买家'},
  {id:'sms',name:'短信通知',desc:'支付成功发短信提醒'},
  {id:'coupon',name:'优惠券',desc:'支持满减优惠券'},
  {id:'commission',name:'分销佣金',desc:'推广赚佣金'},
  {id:'seo',name:'SEO优化',desc:'搜索引擎优化'},
];
let state={email:true,coupon:true};
document.getElementById('list').innerHTML=plugins.map(p=>`
  <div class="plugin">
    <div><div class="plugin-name">${p.name}</div><div class="plugin-desc">${p.desc}</div></div>
    <div class="switch ${state[p.id]?'on':''}" onclick="toggle('${p.id}',this)"></div>
  </div>
`).join('');
function toggle(id,el){el.classList.toggle('on')}
</script>
</body>
</html>
