<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.coupon{background:linear-gradient(135deg,#ff9800,#ff6f00);color:#fff;margin:16px;border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center}
.coupon-amount{font-size:32px;font-weight:700}
.form-card{background:#fff;margin:16px;border-radius:12px;padding:20px}
input{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#ff9800;color:white;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <a href="dashboard.html">‹</a>
  <h2>优惠券</h2>
</div>
<div class="form-card">
  <input id="name" placeholder="优惠券名称">
  <input type="number" id="money" placeholder="减免金额（元）">
  <input type="number" id="min" placeholder="满多少可用">
  <button class="btn" onclick="addCoupon()">创建优惠券</button>
</div>
<div id="list"></div>
<script>
const uid=localStorage.getItem('uid');
async function load(){
  const res=await fetch('/api/coupons?mid='+uid);
  const data=await res.json();
  document.getElementById('list').innerHTML=data.map(c=>`
    <div class="coupon">
      <div><div style="opacity:.9;font-size:13px">满${c.min}元可用</div><div class="coupon-amount">￥${c.money}</div></div>
      <div style="text-align:right"><div style="font-weight:600">${c.name}</div><div style="opacity:.9;font-size:13px;margin-top:4px">已领${c.used||0}张</div></div>
    </div>
  `).join('');
}
async function addCoupon(){
  await fetch('/api/coupons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mid:uid,name:name.value,money:parseFloat(money.value),min:parseFloat(min.value)})});
  load();
}
load();
</script>
</body>
</html>
