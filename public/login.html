<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家登录 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;text-align:center;padding:50px 20px}
.header h1{font-size:28px;margin-bottom:6px}
.card{background:#fff;border-radius:16px;padding:30px;margin:-20px 16px 0;position:relative;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:8px}
.form-group input{width:100%;padding:12px 14px;border:1px solid #eee;border-radius:10px;font-size:15px;background:#fafafa;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin-top:10px}
.error{background:#ffebee;color:#f44336;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="header">
  <h1>龙黑发卡</h1>
  <p style="opacity:.9">自动发卡平台</p>
</div>
<div class="card">
  <h2 style="font-size:20px;margin-bottom:6px">商家登录</h2>
  <p style="color:#999;font-size:14px;margin-bottom:24px">登录后管理您的商品和订单</p>
  <div class="error" id="err"></div>
  <form onsubmit="doLogin(event)">
    <div class="form-group">
      <label>邮箱账号</label>
      <input type="email" id="email" placeholder="请输入邮箱" required>
    </div>
    <div class="form-group">
      <label>登录密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn">登 录</button>
  </form>
  <p style="text-align:center;margin-top:20px;color:#999">还没有账号？<a href="register.html" style="color:#2196F3;text-decoration:none">立即注册</a></p>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
  const data=await res.json();
  if(data.error){err.style.display='block';err.textContent=data.error;return}
  localStorage.setItem('uid',data.id);
  localStorage.setItem('email',data.email);
  location.href='dashboard.html';
}
</script>
</body>
</html>
