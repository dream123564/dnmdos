<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>添加商品 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.form-card{background:#fff;margin:16px;border-radius:12px;padding:24px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:#666;margin-bottom:8px}
input,textarea{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;font-size:15px;background:#fafafa;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <a href="goods.html">‹</a>
  <h2>添加商品</h2>
</div>
<div class="form-card">
  <form onsubmit="save(event)">
    <div class="form-group"><label>商品名称</label><input id="name" required></div>
    <div class="form-group"><label>商品简介</label><textarea id="short_desc" rows="2"></textarea></div>
    <div class="form-group"><label>价格（元）</label><input type="number" id="price" step="0.01" required></div>
    <div class="form-group"><label>库存数量</label><input type="number" id="stock" required></div>
    <button type="submit" class="btn">保存商品</button>
  </form>
</div>
<script>
const uid=localStorage.getItem('uid');
async function save(e){
  e.preventDefault();
  await fetch('/api/goods',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mid:uid,name:name.value,short_desc:short_desc.value,price:parseFloat(price.value),stock:parseInt(stock.value)})});
  location.href='goods.html';
}
</script>
</body>
</html>
