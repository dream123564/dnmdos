<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家注册 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;text-align:center;padding:50px 20px}
.card{background:#fff;border-radius:16px;padding:30px;margin:-20px 16px 0;position:relative;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.tip{background:#fff3e0;color:#e65100;padding:12px;border-radius:8px;font-size:13px;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:#666;margin-bottom:8px}
.form-group input{width:100%;padding:12px 14px;border:1px solid #eee;border-radius:10px;font-size:15px;background:#fafafa;outline:none}
.code-row{display:flex;gap:10px}
.code-row input{flex:1}
.btn-code{padding:12px 16px;border:none;border-radius:10px;font-size:13px;cursor:pointer;background:#fff3e0;color:#e65100;white-space:nowrap}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin-top:10px}
.error{background:#ffebee;color:#f44336;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;display:none}
.pay-tip{text-align:center;color:#999;font-size:13px;margin:16px 0}
</style>
</head>
<body>
<div class="header">
  <h1>龙黑发卡</h1>
  <p style="opacity:.9;margin-top:6px">商家注册</p>
</div>
<div class="card">
  <div class="error" id="err"></div>
  <div class="tip">注册需支付 ￥0.10 验证码费用，支付后验证码发送至邮箱</div>
  <form onsubmit="doReg(event)">
    <div class="form-group">
      <label>邮箱账号</label>
      <input type="email" id="email" placeholder="请输入邮箱" required>
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="code" placeholder="请输入6位验证码" maxlength="6" required>
        <button type="button" class="btn-code" id="payBtn" onclick="payForCode()">￥0.10 获取验证码</button>
      </div>
    </div>
    <div class="form-group">
      <label>设置密码（至少6位）</label>
      <input type="password" id="password" placeholder="请设置登录密码" required>
    </div>
    <button type="submit" class="btn">注 册</button>
  </form>
  <p class="pay-tip">支付方式：支付宝 / 微信支付</p>
  <p style="text-align:center;margin-top:20px;color:#999">已有账号？<a href="login.html" style="color:#2196F3;text-decoration:none">立即登录</a></p>
</div>
<script>
async function payForCode(){
  const email=document.getElementById('email').value;
  if(!email){alert('请先输入邮箱');return}
  const btn=document.getElementById('payBtn');
  btn.disabled=true;
  btn.textContent='正在跳转支付...';
  const res=await fetch('/api/pay_code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
  const data=await res.json();
  if(data.pay_url){location.href=data.pay_url}
}
async function doReg(e){
  e.preventDefault();
  const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,code:code.value})});
  const data=await res.json();
  if(data.error){err.style.display='block';err.textContent=data.error;return}
  localStorage.setItem('uid',data.id);
  localStorage.setItem('email',data.email);
  location.href='dashboard.html';
}
</script>
</body>
</html>
