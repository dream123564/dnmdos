<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店铺设置 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333;padding-bottom:70px}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.form-card{background:#fff;margin:16px;border-radius:12px;padding:20px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:#666;margin-bottom:8px}
input,textarea{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;font-size:15px;background:#fafafa;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin-top:10px}
.share-card{background:#e3f2fd;margin:16px;border-radius:12px;padding:16px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.bottom-nav a{text-decoration:none;color:#999;font-size:12px;text-align:center}
.bottom-nav a.active{color:#2196F3}
</style>
</head>
<body>
<div class="header">
  <a href="dashboard.html">‹</a>
  <h2>店铺设置</h2>
</div>
<div class="share-card">
  <p style="font-size:13px;color:#666;margin-bottom:8px">你的店铺链接：</p>
  <p style="font-size:15px;color:#1677FF;font-weight:600" id="shopLink"></p>
</div>
<div class="form-card">
  <div class="form-group"><label>店铺名称</label><input id="shopName" placeholder="我的店铺"></div>
  <div class="form-group"><label>店铺公告</label><textarea id="notice" rows="3" placeholder="欢迎光临本店，24小时自动发货！"></textarea></div>
  <div class="form-group"><label>客服QQ</label><input id="qq" placeholder="123456789"></div>
  <button class="btn" onclick="save()">保存设置</button>
</div>
<div class="bottom-nav">
  <a href="dashboard.html"><div style="font-size:22px">🏠</div><div>首页</div></a>
  <a href="shop_settings.html" class="active"><div style="font-size:22px">🏪</div><div>店铺</div></a>
  <a href="wallet.html"><div style="font-size:22px">👛</div><div>钱包</div></a>
</div>
<script>
const uid=localStorage.getItem('uid');
document.getElementById('shopLink').textContent='https://serverdo.ccwu.cc/shop.html?uid='+uid;
function save(){alert('保存成功')}
</script>
</body>
</html>
