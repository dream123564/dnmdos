<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员后台 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:#1a237e;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px}
.card{background:#fff;border-radius:12px;padding:20px;text-align:center}
.num{font-size:24px;font-weight:700;color:#1a237e}
.label{font-size:13px;color:#999;margin-top:4px}
.section{margin:16px}
.section h3{font-size:16px;margin-bottom:12px}
.list{background:#fff;border-radius:12px;overflow:hidden}
.item{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f5f5f5;font-size:14px}
.item:last-child{border:none}
</style>
</head>
<body>
<div class="header">
  <h2>管理员后台</h2>
  <button onclick="location.href='index.html'" style="background:rgba(255,255,255,.2);color:white;border:none;padding:6px 14px;border-radius:6px;cursor:pointer">退出</button>
</div>
<div class="grid">
  <div class="card"><div class="num">0</div><div class="label">总商户数</div></div>
  <div class="card"><div class="num">0</div><div class="label">今日新增</div></div>
  <div class="card"><div class="num">0</div><div class="label">总订单数</div></div>
  <div class="card"><div class="num">￥0</div><div class="label">平台流水</div></div>
</div>
<div class="section">
  <h3>商户管理</h3>
  <div class="list" id="merchants"></div>
</div>
<div class="section">
  <h3>系统设置</h3>
  <div class="list">
    <div class="item"><span>平台费率</span><span style="color:#1a237e">2%</span></div>
    <div class="item"><span>最低提现</span><span style="color:#1a237e">￥10.00</span></div>
    <div class="item"><span>自动发卡</span><span style="color:#4caf50">已开启</span></div>
  </div>
</div>
<script>
async function load(){
  const res=await fetch('/api/admin/merchants');
  const data=await res.json();
  document.getElementById('merchants').innerHTML=data.map(m=>`
    <div class="item"><span>${m.email}</span><span style="color:#999">ID:${m.id}</span></div>
  `).join('');
}
load();
</script>
</body>
</html>
