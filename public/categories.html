<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分类管理 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333}
.header{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.header a{color:white;text-decoration:none;font-size:18px}
.form-card{background:#fff;margin:16px;border-radius:12px;padding:20px}
input{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#2196F3;color:white;cursor:pointer}
.cat-item{background:#fff;margin:12px;border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="header">
  <a href="dashboard.html">‹</a>
  <h2>商品分类</h2>
</div>
<div class="form-card">
  <input id="catName" placeholder="分类名称">
  <button class="btn" onclick="addCat()">添加分类</button>
</div>
<div id="list"></div>
<script>
const uid=localStorage.getItem('uid');
async function load(){
  const res=await fetch('/api/categories?mid='+uid);
  const data=await res.json();
  document.getElementById('list').innerHTML=data.map(c=>`<div class="cat-item"><span>${c.name}</span><span style="color:#999">${c.count}个商品</span></div>`).join('');
}
async function addCat(){
  const name=document.getElementById('catName').value.trim();
  if(!name)return;
  await fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mid:uid,name})});
  load();
}
load();
</script>
</body>
</html>
