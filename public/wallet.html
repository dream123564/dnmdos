<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钱包 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#333;padding-bottom:70px}
.wallet-card{background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin:16px;border-radius:16px;padding:30px}
.balance{font-size:36px;font-weight:700;margin:10px 0}
.row{display:flex;gap:12px}
.row div{flex:1}
.stat-box{background:#fff;margin:16px;border-radius:12px;padding:20px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:#2196F3}
.stat-label{font-size:13px;color:#999;margin-top:6px}
.btn{width:calc(100% - 32px);margin:0 16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#ff9800,#ff6f00);color:white;font-size:16px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.bottom-nav a{text-decoration:none;color:#999;font-size:12px;text-align:center}
.bottom-nav a.active{color:#2196F3}
</style>
</head>
<body>
<div class="wallet-card">
  <p style="opacity:.9">账户余额（元）</p>
  <div class="balance">￥0.00</div>
  <div class="row">
    <div><p style="opacity:.9;font-size:13px">待结算</p><p style="font-weight:600;margin-top:4px">￥0.00</p></div>
    <div><p style="opacity:.9;font-size:13px">已结算</p><p style="font-weight:600;margin-top:4px">￥0.00</p></div>
  </div>
</div>
<button class="btn">申请提现</button>
<div class="stat-box">
  <div class="stat-num">0</div>
  <div class="stat-label">累计提现次数</div>
</div>
<div class="bottom-nav">
  <a href="dashboard.html"><div style="font-size:22px">🏠</div><div>首页</div></a>
  <a href="shop_settings.html"><div style="font-size:22px">🏪</div><div>店铺</div></a>
  <a href="wallet.html" class="active"><div style="font-size:22px">👛</div><div>钱包</div></a>
</div>
</body>
</html>
