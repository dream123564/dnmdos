<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱验证 - 龙黑发卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:30px;width:90%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:22px;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#999;font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;color:#666;margin-bottom:8px}
input{width:100%;padding:12px 14px;border:1px solid #eee;border-radius:10px;font-size:15px;background:#fafafa;outline:none}
.code-row{display:flex;gap:10px}
.code-row input{flex:1}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1677FF,#2196F3);color:#fff;margin-top:10px}
.btn-code{padding:12px 16px;border:none;border-radius:10px;font-size:13px;cursor:pointer;background:#e3f2fd;color:#1677FF;white-space:nowrap}
.btn-code:disabled{background:#f5f5f5;color:#bbb;cursor:not-allowed}
.msg{text-align:center;font-size:14px;margin-top:16px;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>邮箱验证</h1>
  <p class="sub">验证你的邮箱以完成注册</p>
  <div class="form-group">
    <label>邮箱地址</label>
    <input type="email" id="email" placeholder="example@qq.com">
  </div>
  <div class="form-group">
    <label>验证码</label>
    <div class="code-row">
      <input type="text" id="code" placeholder="6位验证码" maxlength="6">
      <button class="btn-code" id="sendBtn" onclick="sendCode()">发送验证码</button>
    </div>
  </div>
  <button class="btn" onclick="verifyCode()">验证并注册</button>
  <div class="msg" id="msg"></div>
</div>

<script>
// ========== EmailJS 配置 ==========
const EMAILJS_SERVICE_ID = 'service_b14b5b2';
const EMAILJS_TEMPLATE_ID = 'template_r3dldzr';
const EMAILJS_PUBLIC_KEY = 'CeTJ2Yi33yZxHfhbV';
// ==================================

let countdown = 0;
let timer = null;
let currentCode = '';

function genCode() {
  return Math.floor(100000 + Math.random() * 900000).toString();
}

async function sendCode() {
  const email = document.getElementById('email').value;
  if (!email) { alert('请先输入邮箱'); return; }

  currentCode = genCode();
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '发送中...';

  try {
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: {
          to_email: email,
          subject: '【龙黑发卡】邮箱验证码',
          message: '您的验证码是：' + currentCode + '，5分钟内有效。',
          code: currentCode
        }
      })
    });

    if (res.ok) {
      showMsg('验证码已发送，请查收邮件', 'green');
      countdown = 60;
      timer = setInterval(() => {
        btn.textContent = countdown + '秒后重发';
        countdown--;
        if (countdown < 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '重新发送';
        }
      }, 1000);
    } else {
      showMsg('发送失败，请检查邮箱地址', 'red');
      btn.disabled = false;
      btn.textContent = '发送验证码';
    }
  } catch (e) {
    showMsg('发送失败：' + e.message, 'red');
    btn.disabled = false;
    btn.textContent = '发送验证码';
  }
}

function verifyCode() {
  const inputCode = document.getElementById('code').value;
  if (!inputCode) { alert('请输入验证码'); return; }
  if (inputCode === currentCode) {
    showMsg('验证成功！正在注册...', 'green');
    // 这里跳转到注册完成页面
  } else {
    showMsg('验证码错误', 'red');
  }
}

function showMsg(text, color) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.style.color = color === 'green' ? '#4caf50' : '#f44336';
  m.style.display = 'block';
}
</script>
</body>
</html>
